  - "Itálica: bus da Plaza de Armas spesso meglio dell'auto"
  - "Córdoba: AVE da Santa Justa (~45 min) oppure EV"
  - "Cádiz / Doñana / Ochando (Los Rosales): EV; bici a casa"
  - "Caldo >32° o UV alto: monumenti presto, indoor a mezzogiorno, tapas dopo le 20:00"

